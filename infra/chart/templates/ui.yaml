{{- if .Values.ui.enabled }}
{{/*
Chat in a browser. Points at the GATEWAY, so a browser request passes through
admission like any other — validation refuses ui.enabled without gateway.enabled,
because pointed at an engine it would bypass the thing under test.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    {{- include "lab.labels" . | nindent 4 }}
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: webui
          image: {{ .Values.ui.image }}
          env:
            - name: WEBUI_AUTH
              value: "false"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: http://orch-serve:{{ .Values.gateway.port }}/v1
            - name: OPENAI_API_BASE_URLS
              value: http://orch-serve:{{ .Values.gateway.port }}/v1
            - name: OPENAI_API_KEY
              value: not-needed
            - name: OPENAI_API_KEYS
              value: not-needed
            - name: DEFAULT_MODELS
              value: {{ index .Values.model.servedNames 0 | quote }}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.ui.nodePort }}
{{- end }}
