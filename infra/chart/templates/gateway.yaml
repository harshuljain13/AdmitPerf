{{- if .Values.gateway.enabled }}
{{/*
The gateway: the one thing in front of the engines, and where an admission policy
belongs. Its entire environment is computed from values, because the static
orch-serve.yaml it replaces hardcoded LAB_TOPOLOGY=disaggregated,
PREFILL_URLS=http://vllm-prefill:8000 and a 3B model — all three wrong for an
aggregated run, and it came up healthy pointing at Services that did not exist.
*/}}
{{- $g := .Values.gateway -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orch-serve
  labels:
    {{- include "lab.labels" . | nindent 4 }}
    app: orch-serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orch-serve
  template:
    metadata:
      labels:
        app: orch-serve
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $g.port }}"
        prometheus.io/path: /metrics
        # Roll the pod when the environment changes. Without this, `helm upgrade` with
        # a new threshold leaves the old gateway running and the next run silently
        # measures the previous policy.
        checksum/env: {{ toYaml $g | sha256sum }}
    spec:
      containers:
        - name: orch
          image: {{ $g.image }}
          workingDir: {{ $g.libPath }}
          command:
            - sh
            - -c
            - pip install -q -r requirements.txt && python -m gateway.serve
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SERVE_HOST
              value: 0.0.0.0

            # -- topology ----------------------------------------------------
            - name: LAB_TOPOLOGY
              value: {{ .Values.topology.mode }}
            - name: LAB_SPLIT
              value: {{ .Values.topology.split }}
            - name: LOCAL_MODEL
              value: {{ .Values.model.id }}
            - name: TEXT_MODEL
              value: {{ .Values.model.id }}
            # In-cluster Service DNS, not host addresses: a gateway in a Pod reaches a
            # worker by Service name, and Lambda firewalls the public interface to SSH
            # anyway. Aggregated mode points both at the same engines, which is what
            # "aggregated" means.
            - name: PREFILL_URLS
              value: {{ include "lab.poolUrls" (dict "root" . "pools" (list "prefill")) | quote }}
            - name: DECODE_URLS
              value: {{ include "lab.poolUrls" (dict "root" . "pools" (list "decode")) | quote }}

            # -- guardrail ---------------------------------------------------
            # Its own defaults are 512 output tokens and 8,000 prompt CHARACTERS. A
            # prompt at this cluster's KV crossover is ~33,000 characters, so every
            # request came back 400 prompt_too_long — which in a report is a refusal,
            # indistinguishable from the policy working.
            - name: MAX_NEW_TOKENS
              value: "{{ .Values.engine.maxModelLen }}"
            - name: MAX_PROMPT_CHARS
              value: "{{ include "lab.maxPromptChars" . }}"
            # Every name the engine answers to. Without the alias a client using the
            # short name got 400 model_not_allowed for a model the engine served.
            - name: SERVED_NAMES
              value: {{ include "lab.servedNames" . | quote }}

            # -- rate limit --------------------------------------------------
            # 0 disables it. The code's default is 10_000 tokens/min, less than TWO
            # requests at experiment length, so the second arrival shed 429
            # tenant_tokens. A rate limit is client-attributable and says nothing
            # about capacity.
            - name: TENANT_TOKENS_PER_MIN
              value: "{{ $g.tenantTokensPerMin }}"

            # -- admission ---------------------------------------------------
            # NOT YET WIRED: lib/gateway/admission.py and lib/router/router.py carry
            # their own tenant bucket and KV_SATURATION check and import nothing from
            # admitperf. These are set so the gap is visible rather than implied.
            - name: ADMISSION_POLICY
              value: {{ $g.admission.policy | quote }}
            - name: ADMISSION_ENFORCE
              value: "{{ $g.admission.enforce }}"
            {{- range $k, $v := $g.admission.params }}
            - name: ADMISSION_{{ $k | upper }}
              value: {{ $v | quote }}
            {{- end }}

            {{- if .Values.kv.enabled }}
            - name: MOONCAKE_URL
              value: http://mooncake-store:{{ .Values.kv.port }}
            - name: KV_BACKEND
              value: {{ .Values.kv.backend }}
            {{- end }}

            {{- if .Values.overflow.enabled }}
            - name: OVERFLOW_BACKEND
              value: {{ .Values.overflow.provider }}
            - name: OVERFLOW_BASE_URL
              value: {{ .Values.overflow.baseUrl }}
            - name: OVERFLOW_MODEL
              value: {{ .Values.overflow.model }}
            - name: OVERFLOW_MAX_REQS
              value: "{{ .Values.overflow.maxRequests }}"
            - name: OVERFLOW_MAX_TOKENS
              value: "{{ .Values.overflow.maxTokens }}"
            # From a Secret, never a manifest. An API key in a rendered template ends
            # up in `helm get values`, in CI logs, and in git.
            - name: OVERFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.overflow.secretName }}
                  key: api_key
            {{- end }}

            - name: TRACE_PATH
              value: {{ $g.libPath }}/traces/requests.jsonl
          ports:
            - containerPort: {{ $g.port }}
          readinessProbe:
            # /metrics: the gateway has no /v1/models of its own to answer.
            httpGet:
              path: /metrics
              port: {{ $g.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: lib
              mountPath: {{ $g.libPath }}
      volumes:
        - name: lib
          # The synced lib/, so the lab's gateway and router run as source rather than
          # needing an image rebuild per edit.
          hostPath:
            path: {{ $g.libPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: orch-serve
  labels:
    {{- include "lab.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: orch-serve
  ports:
    - port: {{ $g.port }}
      targetPort: {{ $g.port }}
      nodePort: {{ $g.nodePort }}
{{- end }}
