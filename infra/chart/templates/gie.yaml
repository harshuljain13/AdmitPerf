{{- if .Values.gie.enabled }}
{{/*
Gateway API Inference Extension: an InferencePool per pool, each with an endpoint
picker. This is the standardised seam for inference-aware routing and admission, and
the natural home for an AdmitPerf policy — the picker sees KV utilisation and queue
depth per replica, which is exactly Policy.decide(metrics) -> Decision.

Off by default: the EPP service it references does not exist in this tree yet.
*/}}
{{- $root := . -}}
---
# The route that puts the pools behind one address. Both pools are backends of the same
# route; the endpoint picker chooses within a pool.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference-route
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - backendRefs:
        {{- range $pool := .Values.pools }}
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ $pool.name }}-pool
        {{- end }}
{{- range $pool := .Values.pools }}
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: {{ $pool.name }}-pool
spec:
  targetPorts:
    - number: {{ $root.Values.engine.port }}
  selector:
    matchLabels:
      pool: {{ $pool.name }}
  endpointPickerRef:
    name: epp-{{ $pool.name }}
    kind: Service
    port:
      number: {{ $root.Values.gie.eppPort }}
{{- end }}
{{- end }}
