{{- if .Values.observability.enabled }}
{{/*
The eleven dashboards, generated by lib/observability/dashboards.py and picked up by
Grafana's sidecar via the grafana_dashboard=1 label.

A ConfigMap built from files/, so `helm upgrade` replaces them atomically. The old
flow was a kubectl create configmap --dry-run piped through apply in a shell script,
outside Helm's knowledge — so a rollback left the previous dashboards in place.

Regenerate with:  make dashboards
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
  labels:
    {{- include "lab.labels" . | nindent 4 }}
    {{ .Values.observability.grafana.sidecar.dashboards.label }}: {{ .Values.observability.grafana.sidecar.dashboards.labelValue | quote }}
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
