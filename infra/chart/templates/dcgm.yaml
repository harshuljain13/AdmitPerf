{{- if and .Values.observability.enabled .Values.observability.dcgm.enabled }}
{{/*
Per-GPU-node exporter: utilisation, framebuffer, power — the card from outside vLLM.
A DaemonSet, so cardinality is k8s's job rather than a loop: one per node, including
nodes added later.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  labels:
    {{- include "lab.labels" . | nindent 4 }}
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.observability.dcgm.port }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: exporter
          image: {{ .Values.observability.dcgm.image }}
          securityContext:
            # DCGM reads device counters through the driver.
            capabilities:
              add: ["SYS_ADMIN"]
          ports:
            - containerPort: {{ .Values.observability.dcgm.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
spec:
  selector:
    app: dcgm-exporter
  ports:
    - port: {{ .Values.observability.dcgm.port }}
      targetPort: {{ .Values.observability.dcgm.port }}
{{- end }}
