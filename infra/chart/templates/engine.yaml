{{- include "lab.validate" . }}
{{/*
One Deployment and Service per engine replica, looped from .Values.pools.

This loop is what replaces render.py. The old tree had three sources for the same
thing: static k8s-config manifests, a generator in render.py, and lambda_vllm.sh
writing its own `vllm serve` line with different flags. The flags now appear once.
*/}}
{{- $root := . -}}
{{- $e := .Values.engine -}}
{{- range $pool := .Values.pools }}
{{- range $i := until (int $pool.replicas) }}
{{- $name := printf "vllm-%s-%d" $pool.name $i }}
{{- $nodePort := add (int $root.Values.engine.baseNodePort) $i }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "lab.labels" $root | nindent 4 }}
    app: {{ $name }}
    pool: {{ $pool.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        pool: {{ $pool.name }}
      annotations:
        # Scraped by the prometheus stack's kubernetes-pods job. The signal a KV
        # policy reads comes from here, not from the gateway.
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $e.port }}"
        prometheus.io/path: /metrics
    spec:
      {{- if $root.Values.hami.enabled }}
      schedulerName: hami-scheduler
      {{- end }}
      containers:
        - name: vllm
          image: {{ $e.image }}
          args:
            - --model
            - {{ $root.Values.model.id }}
            - --served-model-name
            {{- range (prepend $root.Values.model.servedNames $root.Values.model.id) }}
            - {{ . }}
            {{- end }}
            - --host
            - 0.0.0.0
            - --port
            - "{{ $e.port }}"
            - --max-model-len
            - "{{ $e.maxModelLen }}"
            - --gpu-memory-utilization
            - "{{ $e.gpuMemoryUtilization }}"
            # The flag that decides whether a KV-pressure policy can fire. Omitting it
            # (as lambda_vllm.sh did) leaves vLLM's default of 256, which moves the
            # crossover by 4x and invalidates every number in the plan.
            - --max-num-seqs
            - "{{ $e.maxNumSeqs }}"
            - --tensor-parallel-size
            - "{{ $pool.tensorParallelSize }}"
            - --pipeline-parallel-size
            - "{{ $pool.pipelineParallelSize }}"
            - --distributed-executor-backend
            - {{ $e.distributedExecutorBackend }}
            - --scheduling-policy
            - {{ $e.schedulingPolicy }}
            {{- if $e.enablePrefixCaching }}
            - --enable-prefix-caching
            {{- end }}
            {{- if $e.enableAutoToolChoice }}
            - --enable-auto-tool-choice
            - --tool-call-parser
            - {{ $e.toolCallParser }}
            {{- end }}
            {{- if $root.Values.model.quantization }}
            - --quantization
            - {{ $root.Values.model.quantization }}
            {{- end }}
          ports:
            - containerPort: {{ $e.port }}
          resources:
            limits:
              {{- if $root.Values.slicing.enabled }}
              # A slice, honoured only by the HAMi scheduler. Validation refuses
              # slicing without hami.enabled, because an ignored gpumem request means
              # the pod silently takes a whole card.
              nvidia.com/gpu: 1
              nvidia.com/gpumem: {{ $root.Values.slicing.memPerSliceMiB }}
              {{- else }}
              nvidia.com/gpu: {{ $pool.gpus }}
              {{- end }}
          readinessProbe:
            # /v1/models, not a TCP check. READY 1/1 lies for minutes while
            # torch.compile captures CUDA-graph buckets, and load sent during that
            # window measures compilation rather than serving.
            httpGet:
              path: /v1/models
              port: {{ $e.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 120
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            {{- if $root.Values.model.hfTokenSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.model.hfTokenSecret }}
                  key: token
            {{- end }}
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          # The node's cache. Without it every pod restart re-downloads 15 GB.
          hostPath:
            path: /home/ubuntu/.cache/huggingface
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "lab.labels" $root | nindent 4 }}
    pool: {{ $pool.name }}
spec:
  type: NodePort
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $e.port }}
      targetPort: {{ $e.port }}
      nodePort: {{ $nodePort }}
{{- end }}
{{- end }}
