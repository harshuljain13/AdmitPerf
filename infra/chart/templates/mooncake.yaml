{{- if .Values.kv.enabled }}
{{/*
The KV store, deployed only when a handoff exists. Validation refuses kv.enabled with
aggregated mode, because each engine then does prefill and decode for its own requests
and this would idle — which is what the old bring-up did on a one-GPU box.

CAVEAT: the vendored transport POSTs a metadata dict, not KV bytes. Hop counts here
are instrumentation, not evidence that anything moved.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-store
  labels:
    {{- include "lab.labels" . | nindent 4 }}
    app: mooncake-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-store
  template:
    metadata:
      labels:
        app: mooncake-store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.kv.port }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: store
          image: {{ .Values.gateway.image }}
          workingDir: {{ .Values.gateway.libPath }}
          command: ["sh", "-c", "pip install -q -r requirements.txt && python -m router.mooncake"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MOONCAKE_PORT
              value: "{{ .Values.kv.port }}"
          ports:
            - containerPort: {{ .Values.kv.port }}
          volumeMounts:
            - name: lib
              mountPath: {{ .Values.gateway.libPath }}
      volumes:
        - name: lib
          hostPath:
            path: {{ .Values.gateway.libPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mooncake-store
spec:
  selector:
    app: mooncake-store
  ports:
    - port: {{ .Values.kv.port }}
      targetPort: {{ .Values.kv.port }}
{{- end }}
