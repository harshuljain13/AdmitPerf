{{- if .Values.autoscale.enabled }}
{{/*
One ScaledObject per pool, scaling on orch_tokens_in_flight from the gateway.
Validation refuses this without keda.enabled and observability.enabled: a ScaledObject
with no operator is inert, and the metric only exists if Prometheus scrapes it.
*/}}
{{- $root := . -}}
{{- range $pool := .Values.pools }}
{{- range $i := until (int $pool.replicas) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $pool.name }}-scaler-{{ $i }}
spec:
  scaleTargetRef:
    name: vllm-{{ $pool.name }}-{{ $i }}
  minReplicaCount: {{ $root.Values.autoscale.minReplicas }}
  maxReplicaCount: {{ $root.Values.autoscale.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://{{ $root.Release.Name }}-observability-prometheus.{{ $root.Release.Namespace }}.svc:9090
        query: orch_tokens_in_flight{phase="{{ $pool.name }}"}
        threshold: "{{ $root.Values.autoscale.tokensInFlightThreshold }}"
{{- end }}
{{- end }}
{{- end }}
