# The cluster, in one file. Rendered by `python -m infra.render`.
# Why each choice is what it is: infra/docs/topology.md
#
# No addresses and no secrets here — this file is committed. They come from .env.

hosts:
  - name: gpu-a            # address: LAMBDA_HOST_GPU_A in .env (or LAMBDA)
    gpu:
      kind: A100
      count: 4
      hbm_gb: 40

  # - name: gpu-b
  #   gpu: {kind: H100, count: 4, hbm_gb: 80}


model:
  id: Qwen/Qwen2.5-32B-Instruct
  quantization: int8       # NOT fp8 — A100 is sm80 and cannot execute it
  dtype: auto
  slicing: false           # whole GPUs; a slice cannot hold these weights

  # Declared, not fetched: the KV estimate must work before anything is rented.
  # Verify against the model's config.json once the cluster is up.
  attention:
    layers: 64
    kv_heads: 8
    head_dim: 128
    dtype_bytes: 2


engine:
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  max_num_seqs: 64
  enable_prefix_caching: true    # an agent resends its prompt every turn
  distributed_executor_backend: mp
  scheduling_policy: priority
  tool_call_parser: hermes
  enable_auto_tool_choice: true


topology:
  mode: disaggregated      # aggregated | disaggregated
  split: phase             # phase | capability
  kv_transport: mooncake   # required by disaggregated, refused by aggregated

  pools:
    prefill:
      replicas: 1
      tensor_parallel_size: 2
      pipeline_parallel_size: 1
      host: gpu-a

    decode:
      replicas: 1
      tensor_parallel_size: 2
      pipeline_parallel_size: 1
      host: gpu-a

  # aggregated instead:
  # pools:
  #   engine: {replicas: 2, tensor_parallel_size: 2, host: gpu-a}


placement:
  strategy: least_loaded   # least_loaded | round_robin | prefix_affinity


overflow:
  provider: superlinked
  base_url: https://api.superlinked.com/v1
  model: Qwen/Qwen3.5-4B   # a 4B standing in for a 72B; not an equal service
  max_requests: 20         # lifetime counter per process, not a rate
  max_tokens: 64
  on: [503, 529]           # never 429 — a quota refusal stays local
  # key: OVERFLOW_API_KEY in .env


admission:
  policy: kv_threshold     # resolved from admitperf's registry
  params:
    threshold: 0.90
  require_saturation: true # a run whose signal never moved is reported inert
