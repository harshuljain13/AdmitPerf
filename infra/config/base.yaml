# ===========================================================================
#  AdmitPerf — shared cluster settings
# ===========================================================================
#  NOT RENDERED DIRECTLY. The runnable configs extend this one:
#
#      single.yaml    1 GPU,  aggregated      prove the pipeline
#      pair.yaml      2 GPUs, aggregated      placement becomes a decision
#      disagg.yaml    4 GPUs, disaggregated   the comparison
#
#  Everything here is shared by all three and declared exactly ONCE. This file
#  deliberately has no `topology:` — that is the thing each variant changes, so
#  when two runs differ only by which file was rendered, "same cluster, only the
#  topology changed" is true by construction rather than by discipline.
#  `python -m infra.render` turns it into Kubernetes manifests and the
#  environment the gateway reads, so no value is typed in two places.
#
#  Commands        python -m infra.render infra/config/pair.yaml --plan
#                  python -m infra.render infra/config/pair.yaml --env
#                  python -m infra.render infra/config/pair.yaml --host gpu-1
#
#  Rationale       infra/docs/topology.md
#  Secrets         none here. This file is committed; .env holds addresses
#                  and keys, and the renderer refuses either if found below.
# ===========================================================================


# ---------------------------------------------------------------------------
#  HOSTS — the machines
# ---------------------------------------------------------------------------
#  name           identifier used in manifests, ports and `--host`
#  address_env    .env variable holding the PUBLIC `user@ip`, for SSH and rsync
#  private_env    .env variable holding the PRIVATE address, for worker URLs and
#                 the KV store. These are DIFFERENT NETWORKS: Lambda firewalls
#                 the public interface down to port 22, so a URL built from it
#                 connects to nothing, and the failure is a timeout mid-run
#                 rather than an error at configuration time. Measured on this
#                 fleet: private 10.19.x.x works at 1.55 ms; public 50051 is
#                 refused. Falls back to the public address when unset
#
#  The variable NAMES are not secrets so they belong here; the addresses are, so
#  they do not
#  gpu.kind       card model. Decides what quantizations are possible:
#                 fp8 needs sm89+, so A100 (sm80) cannot run it
#  gpu.count      whole GPUs on this host. A tensor-parallel group cannot
#                 exceed it, because TP all-reduces every layer
#  gpu.hbm_gb     memory per card, before gpu_memory_utilization
#
#  Each host declares its own shape, because a fleet need not be uniform. All of
#  them are declared here once; a PROFILE below picks which to use.
# ---------------------------------------------------------------------------
hosts:
  - name: gpu-1
    address_env: LAMBDA_HOST_1
    private_env: LAMBDA_PRIVATE_1
    gpu: {kind: A100, count: 1, hbm_gb: 40}

  - name: gpu-2
    address_env: LAMBDA_HOST_2
    private_env: LAMBDA_PRIVATE_2
    gpu: {kind: A100, count: 1, hbm_gb: 40}

  - name: gpu-3
    address_env: LAMBDA_HOST_3
    private_env: LAMBDA_PRIVATE_3
    gpu: {kind: A100, count: 1, hbm_gb: 40}

  - name: gpu-4
    address_env: LAMBDA_HOST_4
    private_env: LAMBDA_PRIVATE_4
    gpu: {kind: A100, count: 1, hbm_gb: 40}


# ---------------------------------------------------------------------------
#  MODEL — what is served
# ---------------------------------------------------------------------------
#  id             Hugging Face repo. Weight size is estimated from the
#                 parameter count in this name, to refuse a bad fit early
#  quantization   null = bf16 | fp8 | int8 | awq | gptq
#  dtype          auto lets vLLM pick from the checkpoint
#  slicing        false = whole GPUs. HAMi slicing is refused: two slices of
#                 one card satisfying a two-GPU request would masquerade as
#                 TP=2 across two cards, and every number would be wrong
#  attention      used to compute kv_bytes_per_token, and therefore how many
#                 sequences fit. DECLARED, not read from the model, because
#                 the estimate must work before anything is rented
# ---------------------------------------------------------------------------
model:
  id: Qwen/Qwen2.5-7B-Instruct

  # bf16. A100 cannot execute fp8 at all, and int8 would need a pre-quantized
  # checkpoint. Full-precision weights also leave LESS room for KV, which is
  # the direction this experiment wants.
  quantization: null
  dtype: auto
  slicing: false

  # VERIFY against the model's config.json once the cluster is up. Wrong by 2x
  # moves every concurrency figure by 2x.
  #   kv_bytes_per_token = 2 x layers x kv_heads x head_dim x dtype_bytes
  #                      = 2 x 28 x 4 x 128 x 2 = 56 KiB
  attention:
    layers: 28
    kv_heads: 4
    head_dim: 128
    dtype_bytes: 2


# ---------------------------------------------------------------------------
#  ENGINE — vLLM flags, declared once
# ---------------------------------------------------------------------------
#  max_model_len            context ceiling. Sets KV per sequence, so it is the
#                           strongest lever on how many fit
#  gpu_memory_utilization   fraction of HBM vLLM may claim
#  max_num_seqs             scheduler's concurrency cap. Keep ABOVE what KV
#                           allows, or the scheduler refuses before the cache
#                           does and the run measures a setting, not hardware
#  enable_prefix_caching    an agent resends its system prompt every turn.
#                           Also an experiment axis — but do not compare a
#                           policy across it, since the cache state is what
#                           changed rather than the policy
#  scheduling_policy        priority | fcfs
#  tool_call_parser         the agent needs tool calls to work at all
# ---------------------------------------------------------------------------
engine:
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  max_num_seqs: 64
  enable_prefix_caching: true
  distributed_executor_backend: mp
  scheduling_policy: priority
  tool_call_parser: hermes
  enable_auto_tool_choice: true


# ---------------------------------------------------------------------------
#  PLACEMENT — choosing among replicas in a pool, per request
# ---------------------------------------------------------------------------
#  strategy   least_loaded     fewest in flight
#             round_robin      ignores load; a baseline
#             prefix_affinity  prefers a worker that already cached the prefix
# ---------------------------------------------------------------------------
placement:
  strategy: least_loaded


# ---------------------------------------------------------------------------
#  OVERFLOW — paid capacity for when we refuse
# ---------------------------------------------------------------------------
#  provider       external service name
#  base_url       its OpenAI-compatible endpoint
#  model          a 4B standing in for our 7B: a relief valve, NOT an equal
#                 service. Never pool these responses with local ones
#  max_requests   LIFETIME counter per gateway process, not a rate. Once spent,
#                 overflow turns itself off and requests fall back to the local
#                 refusal — which reads as "overflow did not help" when it
#                 means "overflow went away"
#  max_tokens     output cap on the overflow path only
#  on             status codes that may leave. NEVER 429: a tenant over its own
#                 quota served on capacity we pay for is overspend
#
#  The API key is NOT here. It is OVERFLOW_API_KEY in .env.
# ---------------------------------------------------------------------------
overflow:
  provider: superlinked
  base_url: https://api.superlinked.com/v1
  model: Qwen/Qwen3.5-4B
  max_requests: 20
  max_tokens: 64
  on: [503, 529]


# ---------------------------------------------------------------------------
#  ADMISSION — the point of the whole repository
# ---------------------------------------------------------------------------
#  policy              resolved from AdmitPerf's registry. `admitperf policies`
#                      lists them with the signal each one watches
#  params              passed to the policy's constructor
#  require_saturation  fail a run whose signal never reached its threshold,
#                      rather than reporting it as a null result
# ---------------------------------------------------------------------------
admission:
  policy: kv_threshold
  params:
    threshold: 0.90
  require_saturation: true
