# disagg — prefill and decode as separate pools, across 4 GPUs.
#
# ADDS      a big prefill cannot stall decode for everyone on a worker
# COSTS     half the concurrency. A prefill worker builds KV, hands it off and frees
#           it, so its cache never holds a live sequence — only the decode pool gates
#           how many requests are in flight
#
# CAVEAT    the vendored transport POSTs a metadata dict, NOT KV bytes. Hop counts and
#           token totals are instrumentation; no hop latency can be claimed from this
#           stack. Measured on a Lambda A100 fleet the private network runs at
#           1.6 Gbps single-stream, and a 16k-token 7B sequence is 0.88 GiB of KV
#           against ~2.0 s to recompute it — so a REAL single-stream hop would cost
#           ~4.7 s and lose by 2.4x. The ratio is context-independent.

topology:
  mode: disaggregated
  split: phase

pools:
  - name: prefill
    replicas: 2
    tensorParallelSize: 1
    pipelineParallelSize: 1
    gpus: 1
  - name: decode
    replicas: 2
    tensorParallelSize: 1
    pipelineParallelSize: 1
    gpus: 1

# mooncake is the only backend that moves anything. nccl and nixl are no-op stubs,
# so zero hops would not prove the hop did not happen.
kv:
  enabled: true
  backend: mooncake

autoscale: {enabled: false}
keda:      {enabled: false}
hami:      {enabled: false}
slicing:   {enabled: false}

gateway:
  enabled: true
  tenantTokensPerMin: 0

observability: {enabled: true}
ui:            {enabled: true}
