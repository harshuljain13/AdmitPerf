# single — 1 GPU, one aggregated engine.
#
#   make plan                 what this deploys, and whether a run on it can mean anything
#   make up                   deploy it
#
# PROVES    the bring-up works, the gateway reaches an engine, decisions are logged,
#           a report is produced
# CANNOT    show placement. One engine is one destination, which is routing rather
#           than a decision
#
# WHETHER A KV POLICY CAN FIRE IS A PROPERTY OF THE WORKLOAD, NOT THIS FILE.
# The pool is ~384k tokens (56 KiB/token for this model) and the cache fills with
# maxNumSeqs x tokensPerRequest:
#
#     8192 prompt + 512 out = 8704/req  ->  64 seqs exceed the pool   KV binds
#     2048 prompt + 120 out = 2168/req  ->  64 seqs hold 0.36         scheduler binds
#
# So below ~6.0k tokens/request a 0.90 threshold is unreachable at ANY arrival rate
# and the run is INERT. Check before renting, not after.

topology:
  mode: aggregated
  split: phase

pools:
  - name: engine
    replicas: 1
    tensorParallelSize: 1
    pipelineParallelSize: 1
    gpus: 1

# Nothing hands KV to anything else, so no transport.
kv:
  enabled: false

# One engine: nothing to scale between, and no card is shared.
autoscale: {enabled: false}
keda:      {enabled: false}
hami:      {enabled: false}
slicing:   {enabled: false}

gateway:
  enabled: true
  # Off, so capacity is the only thing that sheds. See values.yaml for why the
  # code's 10_000 default refused 28 of 32 requests at experiment length.
  tenantTokensPerMin: 0

observability: {enabled: true}
ui:            {enabled: true}
gie:           {enabled: false}
overflow:      {enabled: false}
