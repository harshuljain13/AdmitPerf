<?xml version="1.0" encoding="UTF-8"?>
<!-- BRIEF: AdmitPerf banner. Simple. Black background, admit-yellow (#F5C518) wordmark,
     one-line tagline, single thin yellow accent bar at the bottom. No motif, no chip, no grid.
     Size: 1280x260. IDs: bg, wordmark, tagline, accent.
     Tagline reframes -Perf suffix: not measurement-only, but benchmark-driven design. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="AdmitPerf — benchmark-driven admission control layer for LLM inference">
  <g id="bg">
    <rect width="1280" height="260" fill="#0B0B0B"/>
  </g>

  <g id="wordmark" font-family="Helvetica, Arial, sans-serif" font-weight="900">
    <text x="640" y="140" font-size="128" letter-spacing="-3" text-anchor="middle">
      <tspan fill="#F5C518">Admit</tspan><tspan fill="#FFFFFF">Perf</tspan>
    </text>
  </g>

  <g id="tagline" font-family="Helvetica, Arial, sans-serif">
    <text x="640" y="188" font-size="20" fill="#BFBFBF" font-weight="400" letter-spacing="3" text-anchor="middle">
      benchmark-driven admission control layer for LLM inference
    </text>
  </g>

  <g id="accent">
    <rect x="560" y="214" width="160" height="4" fill="#F5C518"/>
  </g>
</svg>
