[project]
name = "admitperf"
version = "0.0.1"
description = "An open benchmark for LLM admission-control policies"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Harshul Jain", email = "harshuljain1393@gmail.com" },
]
requires-python = ">=3.11"
# Runtime deps are deliberately minimal: a policy plugin should be cheap to
# install next to an existing serving stack. Anything needed only for analysis,
# plotting, or trace ingestion lives in an extra.
dependencies = [
    "click>=8.1",     # CLI
    "httpx>=0.27",    # engine adapter (/metrics scrape, OpenAI-compatible calls)
    "pyyaml>=6.0",    # run configs
    "rich>=13.7",     # CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]
dashboard = [
    "streamlit>=1.40",
    "altair>=5.4",
    "pandas>=2.2",
]
analysis = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
traces = [
    "datasets>=2.19",
]

# Everything, for a working copy of the repo:
#     pip install -e '.[all]'
all = [
    "admitperf[dev,dashboard,analysis,traces]",
]

[project.scripts]
admitperf = "admitperf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `infra` ships too, because the CLI imports infra.render to turn a cluster config
# into manifests. Without it, `admitperf run` works when launched from the repo
# root — cwd is on sys.path — and fails with ModuleNotFoundError everywhere else.
# That is the worst kind of packaging bug: it passes every test run from the
# checkout and breaks for anyone who installs the wheel.
packages = ["src/admitperf", "infra"]

[tool.ruff]
line-length = 100
target-version = "py311"
# infra/ is vendored from the class 10 cluster. Reformatting it to this project's style
# would make every future diff against upstream unreadable, so it keeps its own.
# Markdown is excluded because its code blocks are illustrative, not compiled.
extend-exclude = ["infra", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Adapter API v0 is frozen (see docs/status.md). These two rules would change the
# public contract, so they are suppressed rather than applied:
#   UP042 — `StrEnum` changes what `str(DecisionKind.ADMIT)` returns.
#   B027  — on_admit/on_complete/on_preempt are intentionally non-abstract, so a
#           policy only has to implement `decide()`.
"src/admitperf/core/api.py" = ["UP042", "B027"]

[tool.mypy]
python_version = "3.11"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
