[project]
name = "admitperf"
version = "0.0.1"
description = "An open benchmark for LLM admission-control policies"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Harshul Jain", email = "harshuljain1393@gmail.com" },
]
requires-python = ">=3.11"
# Runtime deps are deliberately minimal: a policy plugin should be cheap to
# install next to an existing serving stack. Anything needed only for analysis,
# plotting, or trace ingestion lives in an extra.
# httpx went with the engine adapter: AdmitPerf no longer scrapes anything, because
# a network round trip has no place on an admission decision. pyyaml and rich went
# with the run configs and the harness output.
dependencies = [
    "click>=8.1",     # the CLI only. The decision path needs nothing.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # The suite covers infra/render.py, which reads cluster YAML. pyyaml is a
    # dev dependency rather than a runtime one: `infra/` is a worked example of a
    # host, not part of the package, so the decision path must not need it.
    "pyyaml>=6.0",
]
dashboard = [
    "streamlit>=1.40",
    "altair>=5.4",
    "pandas>=2.2",
]
# Everything, for a working copy of the repo:
#     pip install -e '.[all]'
all = [
    "admitperf[dev,dashboard]",
]

[project.scripts]
admitperf = "admitperf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admitperf"]
# The dashboard's wordmark and favicon. Without these in the wheel a pip-installed
# dashboard falls back to markup, which works but is not the brand.
artifacts = ["src/admitperf/dashboard/assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"
# infra/ is vendored from the class 10 cluster. Reformatting it to this project's style
# would make every future diff against upstream unreadable, so it keeps its own.
# Markdown is excluded because its code blocks are illustrative, not compiled.
extend-exclude = ["infra", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Adapter API v0 is frozen (see docs/status.md). These two rules would change the
# public contract, so they are suppressed rather than applied:
#   UP042 — `StrEnum` changes what `str(DecisionKind.ADMIT)` returns.
#   B027  — on_admit/on_complete/on_preempt are intentionally non-abstract, so a
#           policy only has to implement `decide()`.

[tool.mypy]
python_version = "3.11"
strict = true
# Runs only inside a Modal container, against decorators we do not have stubs
# for locally. Type-checking it here would check Modal, not us.
exclude = []

[[tool.mypy.overrides]]
module = "infra.providers.modal_app"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
