# Taken from docs/assets/banner.svg, not chosen here: near-black ground,
# admit-yellow accent, grey secondary text. The wordmark spells "Admit" in
# yellow, which is why yellow is also the admitted outcome throughout the app.
[theme]
base = "dark"
primaryColor = "#F5C518"
backgroundColor = "#0B0B0B"
secondaryBackgroundColor = "#141414"
textColor = "#FFFFFF"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"
