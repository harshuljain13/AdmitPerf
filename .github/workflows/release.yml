name: Release

# Releases are cut from a TAG, never from a branch, so what is published is a fixed, named
# commit that can be checked out again years later.
#
#   # bump the version in pyproject.toml — __version__ reads it from metadata
#   git commit -am "release: 0.0.1" && git tag v0.0.1 && git push origin v0.0.1
#
# A tag runs TestPyPI first, then installs the package back OUT of TestPyPI and smoke-tests
# it before touching PyPI. That round trip is the only thing that catches a missing
# dependency or a bad pin, because it is a real index resolve rather than a local path.
#
# Publishing uses Trusted Publishing (OIDC), so no API token is stored in this repository.
# Configure once at https://pypi.org/manage/account/publishing/ with
#   owner harshuljain13 · repo AdmitPerf · workflow release.yml · environment pypi
on:
  push:
    tags: ["v*"]
  # Rehearse against TestPyPI without cutting a tag.
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish. A tag always does testpypi -> verify -> pypi."
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A tag is the name the release is remembered by, so it has to agree with the
      # version inside the package. Without this check, tagging v0.1.0 while pyproject
      # says 0.0.1 publishes 0.0.1 under a v0.1.0 tag, and nothing ever notices.
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade pip
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          echo "pyproject: $declared   tag: $tagged"
          test "$declared" = "$tagged" || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml"
            exit 1
          }

      - run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Catches a malformed README or missing metadata before either index sees it.
      # PyPI rejects a bad long_description outright, and the failure there is far
      # less legible than this one.
      - name: Check the artifacts
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    # OIDC. The token is minted per run; nothing long-lived is stored.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Rehearsing twice at the same version is normal; a hard failure on
          # "file already exists" would make the dry run useless. Deliberately NOT
          # set for PyPI, where re-uploading a version is a mistake worth stopping.
          skip-existing: true

  verify:
    name: Install from TestPyPI and smoke-test
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Dependencies come from real PyPI; only admitperf itself from TestPyPI, which does
      # not mirror the whole ecosystem. Without extra-index-url this fails on every dep.
      - name: Install from the index, not from a path
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3 4 5; do
            pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              admitperf && break
            echo "index not caught up yet, retry $i"; sleep 20
          done
      # Exercise the contract, not just the import. A package that installs and then
      # cannot make a decision is a package that passed the wrong test.
      - name: Smoke-test what was published
        run: |
          python -c "from admitperf import Policy, Decision, Signal, Verdict, Log"
          python -c "from admitperf.policies import KvThreshold, QueueDepth, DualGate, NoAdmission"
          python - <<'PY'
          from admitperf import Policy
          from admitperf.core.signals import KV_PRESSURE

          class Wall(Policy):
              name = "wall"
              def decide(self, metrics):
                  if KV_PRESSURE.read(metrics) >= 0.9:
                      return self.reject("kv_pressure")
                  return self.admit()

          busy = Wall()({"vllm:kv_cache_usage_perc": 0.95}, request_id="r1")
          assert not busy.admitted and busy.status == 503, busy
          idle = Wall()({"vllm:kv_cache_usage_perc": 0.10}, request_id="r2")
          assert idle.admitted and idle.status == 200, idle
          # Absence is never zero: nothing supplied, so the signal is unreadable and
          # the policy must not conclude the cache is empty.
          assert KV_PRESSURE.read({}) is None
          print("contract ok")
          PY
          admitperf --help > /dev/null
          admitperf signals > /dev/null

  pypi:
    name: Publish to PyPI
    needs: verify
    # Only a tag publishes for real. A manual run stops after the TestPyPI round trip
    # unless it explicitly asked for pypi.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
