# Tensor-parallel across four GPUs. `infra up` refuses before deploying if
# tensor_parallel_size × pipeline_parallel_size exceeds gpu_count, rather than
# failing after the weights have downloaded.
name: llama-8b-tp4

infra:
  gpu: A100
  gpu_count: 4
  model: meta-llama/Llama-3.1-8B-Instruct   # gated: needs HF_TOKEN
  max_concurrent_inputs: 512
  engine:
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    max_num_seqs: 16
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    enable_prefix_caching: false

workload:
  n: 500
  rate: 40

policies:
  - no_admission
  - name: queue_depth
    max_waiting: 32
  # Long contexts on a large model genuinely fill the KV cache, which is the
  # regime where this signal carries the pressure. On a 0.5B model it does not.
  - name: kv_threshold
    threshold: 0.85

bench:
  repeats: 3
