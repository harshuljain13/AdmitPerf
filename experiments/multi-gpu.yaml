# Tensor-parallel across four GPUs. `infra up` refuses before deploying if
# tensor_parallel_size × pipeline_parallel_size exceeds gpu_count.
name: llama-8b-tp4

infra:
  gpu: A100
  gpu_count: 4
  model: meta-llama/Llama-3.1-8B-Instruct
  engine:
    tensor_parallel_size: 4
    max_num_seqs: 16
    max_model_len: 8192
    gpu_memory_utilization: 0.90

workload:
  n: 500
  rate: 40

policies:
  - no_admission
  - name: kv_threshold
    threshold: 0.85

bench:
  repeats: 3
